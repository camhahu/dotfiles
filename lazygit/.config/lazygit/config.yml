gui:
  showRandomTip: false
  nerdFontsVersion: "3"
  border: rounded
  sidePanelWidth: 0.25
  statusPanelView: allBranchesLog
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white

git:
  pagers:
    - pager: delta --dark --paging=never --hunk-header-style=omit --file-decoration-style=none --file-style=omit --line-numbers --keep-plus-minus-markers --syntax-theme="Visual Studio Dark+"
  diffContextSize: 15
