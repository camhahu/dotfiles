# Starship Configuration
# https://starship.rs/config/

# Disable blank line between prompts
add_newline = false

# Prompt format
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[directory]
truncation_length = 3
truncate_to_repo = true
style = 'bold cyan'

[git_branch]
symbol = ' '
style = 'bold purple'

[git_status]
style = 'bold red'

[cmd_duration]
min_time = 2000
format = '[$duration]($style) '
style = 'yellow'

[nodejs]
format = '[$symbol($version )]($style)'
symbol = ' '

[bun]
format = '[$symbol($version )]($style)'
symbol = '🥟 '

[python]
format = '[$symbol($version )]($style)'
symbol = ' '

[rust]
format = '[$symbol($version )]($style)'
symbol = ' '

[golang]
format = '[$symbol($version )]($style)'
symbol = ' '
