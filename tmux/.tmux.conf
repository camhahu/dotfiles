# scrollback size
set -g history-limit 10000

# prevents any delay on nvim processing the escape key
set -s escape-time 0

################################
# Keybinds
###############################

# Changing ctrl b to ctrl a as the command button
unbind C-b
set -g prefix C-a

# set first window to index 1 (not 0) to map more to the keyboard layout
set -g base-index 1
set -g pane-base-index 1

# pass through xterm keys
set -g xterm-keys on

# Keep your finger on ctrl, or don't, same result
bind-key C-d detach-client
bind-key C-p paste-buffer

# Redraw the client (if interrupted by wall, etc)
bind R refresh-client

# reload tmux config with ctrl + a + r
unbind r
unbind C-r
bind r source-file ~/.tmux.conf
bind C-r source-file ~/.tmux.conf

# Vertical splits with g or C-g
unbind g
unbind C-g
bind-key g split-window -h -c "#{pane_current_path}"
bind-key C-g split-window -h -c "#{pane_current_path}"

# Horizontal splits with f or C-f
unbind f
unbind C-f
bind-key f split-window -c "#{pane_current_path}"
bind-key C-f split-window -c "#{pane_current_path}"

# Ctrl + a + o rename window
# unbind o
# unbind C-o
# bind-key C-o rename-window

# Using the mouse to switch panes
set -g mouse on

# Ctrl - t or t new window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# Ctrl - w or w to kill panes
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane
# C + control q to kill session

unbind q
unbind C-q
bind-key q kill-session
bind-key C-q kill-session

# Switching panes with vim keys
unbind h
unbind C-h
unbind j
unbind C-j
unbind k
unbind C-k
unbind l
unbind C-l
bind-key h select-pane -L
bind-key C-h select-pane -L
bind-key l select-pane -R
bind-key C-l select-pane -R
bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key j select-pane -D
bind-key C-j select-pane -D

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Ctrl + a + n : New session
unbind n
unbind C-n
bind-key n new-session
bind-key C-n new-session

# Ctrl + a + Pagedown : Next window
#unbind Pagedown
unbind ]
unbind C-]
bind-key ] next-window
bind-key C-] next-window

# Ctrl + a + Pagup : Previous window
#unbind Pageup
unbind [
unbind C-[
bind-key [ previous-window
bind-key C-[ previous-window

# Zoom with ctrl + a + ctrl + '+'
#unbind C-+
#bind C-+ \
#new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read'\;\
#swap-pane -s tmux-zoom.0 \;\
#select-window -t tmux-zoom

# Zoom back ctrl + a + ctrl + '-'
#unbind C--
#bind C-- \
#	last-window \;\
#	swap-pane -s tmux-zoom.0 \;\
#	kill-window -t tmux-zoom

# Visual Activity Monitoring between windows
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style bg=#3a6ea5,fg=white

# Show tmux positions in titles
set -g set-titles on

# Set up a basic panel structure for command + ctr D
bind D source-file ~/.tmux/dev

# set shell
set -g default-shell /bin/zsh

# Attach to a session if runs otherwise create a new one
# Note: Run this only when tmux starts, not on config reload
# new-session -n $HOST

set-option -g status-position top
set -g status 2
set-option -g status-style bg=#1e3a5f,fg=white
set-option -g status-left '   #[bold]#{session_name}   #[default]'
set-option -g status-left-length 30
set-option -g status-right ''
set -g 'status-format[1]' '#[align=left] #{pane_current_path}#[align=centre]#{?window_activity_flag,#[bg=#3a6ea5#,fg=white] activity in #{window_name} #[default],}#[align=right]%H:%M  %d %b '



# Keep inactive tabs slightly lighter than status bar background
set -g window-status-style fg=white
set -g window-status-format '   #{p12:#{=12:window_name}}   '

# Make the active tab lime green
set -g window-status-current-style bg=#a6e22e,fg=black,bold
set -g window-status-current-format '   #{p12:#{=12:window_name}}   '

# Add separators between tabs (tmux 3.2+)
set -g window-status-separator ''

set -g status-justify left


# Stop apps from changing names
set -g allow-rename off
set -g automatic-rename off

set -g renumber-windows on

